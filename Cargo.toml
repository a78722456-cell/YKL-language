[workspace]
resolver = "2"
members = [
    "crates/apl_lexer",
    "crates/apl_ast",
    "crates/apl_parser",
    "crates/apl_sema",
    "crates/apl_mir",
    "crates/apl_opt",
    # "crates/apl_vm",
    "crates/apl_codegen",
    "crates/apl_runtime",
    "crates/apl_stdlib",
    "crates/apl_cli",
    "crates/apl_lsp",
    "crates/apl_test", 
    "crates/apl_fmt", 
    "crates/apl_hir", "crates/apl_borrowck",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ali", "ITstep Academy"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/youngkazah/youngkazah"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
regex = "1.10"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
dashmap = "6.0"
crossbeam-channel = "0.5"
tower-lsp = "0.20"
